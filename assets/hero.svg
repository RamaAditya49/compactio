<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="compactio: System 1 for your coding agent">
<title>compactio: System 1 for your coding agent</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.drop, .keep { animation: 4.8s linear infinite; }
.drop { fill: #f59e0b; animation-name: drop; }
.keep { fill: #f59e0b; animation-name: keep; }
@keyframes drop {
  0% { transform: translateX(0); opacity: 0; }
  8% { opacity: .9; }
  52% { transform: translateX(250px); opacity: .9; }
  62% { transform: translateX(262px) translateY(24px); opacity: 0; }
  100% { transform: translateX(262px) translateY(24px); opacity: 0; }
}
@keyframes keep {
  0% { transform: translateX(0); opacity: 0; fill: #f59e0b; }
  8% { opacity: .9; }
  52% { transform: translateX(250px); fill: #f59e0b; }
  56% { fill: #34d399; }
  92% { transform: translateX(470px); opacity: 1; fill: #34d399; }
  100% { transform: translateX(490px); opacity: 0; fill: #34d399; }
}
.gate { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
</style>

<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1f2733" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#0b0f14" stop-opacity="1"/>
    <stop offset=".45" stop-color="#0b0f14" stop-opacity=".6"/>
    <stop offset="1" stop-color="#0b0f14" stop-opacity=".2"/>
  </linearGradient>
</defs>
<rect width="1280" height="400" rx="18" fill="#0b0f14"/>
<rect width="1280" height="400" rx="18" fill="url(#grid)"/>
<rect width="1280" height="400" rx="18" fill="url(#fade)"/>
<rect x=".5" y=".5" width="1279" height="399" rx="18" fill="none" stroke="#1f2733"/>

<text x="72" y="150" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-2">compactio</text>
<text x="74" y="200" font-size="28" fill="#e6edf3">System 1 for your coding agent.</text>
<text x="74" y="244" font-size="19" fill="#8b949e">The LLM thinks. compactio decides. Code executes.</text>
<g class="mono" font-size="15">
  <rect x="74" y="284" width="186" height="34" rx="8" fill="#11161d" stroke="#1f2733"/>
  <text x="92" y="306" fill="#8b949e" class="mono">20,501 → <tspan fill="#34d399">747</tspan> chars</text>
  <rect x="272" y="284" width="112" height="34" rx="8" fill="#11161d" stroke="#1f2733"/>
  <text x="290" y="306" fill="#8b949e" class="mono">0.75 s</text>
  <rect x="396" y="284" width="130" height="34" rx="8" fill="#11161d" stroke="#1f2733"/>
  <text x="414" y="306" fill="#8b949e" class="mono">$0.00005</text>
</g>

<text x="660" y="140" font-size="14" fill="#8b949e" class="mono">tool output</text>
<text x="1206" y="140" font-size="14" fill="#8b949e" class="mono" text-anchor="end">context</text>
<rect class="drop" x="660" y="178" width="22" height="14" rx="4" style="animation-delay:0s"/>
<rect class="keep" x="660" y="214" width="29" height="14" rx="4" style="animation-delay:-0.3s"/>
<rect class="drop" x="660" y="250" width="36" height="14" rx="4" style="animation-delay:-0.6s"/>
<rect class="drop" x="660" y="286" width="43" height="14" rx="4" style="animation-delay:-0.9s"/>
<rect class="drop" x="660" y="178" width="50" height="14" rx="4" style="animation-delay:-1.2s"/>
<rect class="keep" x="660" y="214" width="27" height="14" rx="4" style="animation-delay:-1.5s"/>
<rect class="drop" x="660" y="250" width="34" height="14" rx="4" style="animation-delay:-1.8s"/>
<rect class="drop" x="660" y="286" width="41" height="14" rx="4" style="animation-delay:-2.1s"/>
<rect class="drop" x="660" y="178" width="48" height="14" rx="4" style="animation-delay:-2.4s"/>
<rect class="keep" x="660" y="214" width="25" height="14" rx="4" style="animation-delay:-2.7s"/>
<rect class="drop" x="660" y="250" width="32" height="14" rx="4" style="animation-delay:-3s"/>
<rect class="drop" x="660" y="286" width="39" height="14" rx="4" style="animation-delay:-3.3s"/>
<rect class="drop" x="660" y="178" width="46" height="14" rx="4" style="animation-delay:-3.6s"/>
<rect class="keep" x="660" y="214" width="23" height="14" rx="4" style="animation-delay:-3.9s"/>
<rect class="drop" x="660" y="250" width="30" height="14" rx="4" style="animation-delay:-4.2s"/>
<rect class="drop" x="660" y="286" width="37" height="14" rx="4" style="animation-delay:-4.5s"/>

<g class="gate">
  <rect x="930" y="160" width="4" height="150" rx="2" fill="#34d399"/>
  <rect x="918" y="160" width="28" height="150" rx="8" fill="#34d399" opacity=".08"/>
</g>
<text x="932" y="338" font-size="14" fill="#34d399" text-anchor="middle" class="mono">System 1 · Jev</text>
<rect x="1150" y="160" width="56" height="150" rx="10" fill="#11161d" stroke="#f59e0b" stroke-opacity=".6"/>
<text x="1178" y="240" font-size="14" fill="#f59e0b" text-anchor="middle" class="mono">LLM</text>
<text x="1178" y="338" font-size="14" fill="#8b949e" text-anchor="middle" class="mono">System 2</text>
</svg>
